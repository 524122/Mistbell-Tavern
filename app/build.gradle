plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "com.google.devtools.ksp"
    id "io.gitlab.arturbosch.detekt"
    id "org.jlleitschuh.gradle.ktlint"
    id "com.github.jk1.dependency-license-report"
}

// 依赖许可证报告（供根项目 licenseGuard 消费；输出目录对齐根 build/reports/licenses）
licenseReport {
    outputDir = "$rootDir/build/reports/licenses"
    renderers = [new com.github.jk1.license.render.JsonReportRenderer("index.json", false)]
}

// jk1 插件任务持有 Project 引用，与配置缓存不兼容
tasks.named('generateLicenseReport') {
    notCompatibleWithConfigurationCache('jk1 dependency-license-report 尚未适配配置缓存')
}

android {
    namespace "com.mistbell.tavern.android"
    compileSdk 37

    defaultConfig {
        applicationId "com.mistbell.tavern.android"
        minSdk 26
        targetSdk 37
        versionCode 16
        versionName "0.9.5-beta"
    }

    // v0.9：onnxruntime 原生库按 ABI 分包（arm64 ≈16MB / x86 等），避免单 universal APK 被
    // 无关架构拖大；universal 保留，侧载用户仍可按原方式安装
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug 构建也启用资源压缩（但不混淆代码）
            shrinkResources false
            minifyEnabled false
            // 隔离验收构建：显式传 -PisolatedMemoryValidation 才改测试包名，不影响常规 debug/release。
            if (project.hasProperty('isolatedMemoryValidation')) {
                applicationIdSuffix '.memoryvalidation'
            }
            if (project.hasProperty('isolatedApplicationIdSuffix')) {
                applicationIdSuffix = project.property('isolatedApplicationIdSuffix')
            }
            // 产出未签名 APK 的开关：gradlew :app:assembleDebug -PbuildUnsigned
            // （未签名包不能直接安装，需自行 apksigner 签名；用于自定义签名/分发场景）
            if (project.hasProperty('buildUnsigned')) {
                signingConfig = null
            }
        }
    }

    // 优化 APK 体积
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
            excludes += ['/META-INF/INDEX.LIST']
            excludes += ['/META-INF/DEPENDENCIES']
        }
        jniLibs {
            // sqlite3_load_extension 需要文件系统路径：.so 必须从 APK 解压到设备
            //（AGP 不允许在 manifest 里直接设 extractNativeLibs，等效开关在这里）
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Room schema 导出目录（exportSchema=true 时 KSP 输出到这里，迁移测试消费）
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // JVM 单元测试没有 Android 运行时：未 stub 的框架方法（android.util.Log 等）返回默认值，
    // 而不是抛 "not mocked"。注入式服务（VectorMemoryService 等）因此可以做纯 JVM 回归测试。
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    // JS 脚本沙箱（规则包 script.js 的宿主）：纯 JVM、无网络/文件能力，指令数限流防失控
    implementation "org.mozilla:rhino:1.8.0"

    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom

    // Compose UI
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Material 3
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3:material3-window-size-class"
    implementation "androidx.compose.material:material-icons-extended"

    // Activity & Lifecycle
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    // Navigation
    implementation "androidx.navigation:navigation-compose:2.8.5"

    // Networking
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // F1: SSE 真流式支持
    implementation "com.squareup.okhttp3:okhttp-sse:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

    // Image loading
    implementation "io.coil-kt:coil-compose:2.7.0"

    // ExifInterface for image rotation
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    // Core
    implementation "androidx.core:core-ktx:1.15.0"

    // Room
    // Room 2.8.x is compatible with the current Kotlin/KSP toolchain; 2.6.1
    // crashes in KSP while resolving Unit-returning @Query methods (JVM V signature).
    def roomVersion = '2.8.5'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // F3 本地语义向量：onnxruntime-android（MIT）+ assets 内置量化 BGE 中文模型
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.17.3"

    // 向量索引存储（sqlite-vec）：系统 SQLite 不支持加载扩展，用 requery 的自带 SQLite 打开
    // 独立向量库并加载 jniLibs 里的 vec0.so（android:extractNativeLibs="true" 提供文件系统路径）
    implementation "com.github.requery:sqlite-android:3.49.0"

    // 单元测试（本地 JVM）
    testImplementation "junit:junit:4.13.2"

    // Room 迁移测试（instrumented）
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:core:1.6.1"
}

// ---- F0 质量门配置（见 docs/FOUNDATION.md）----

detekt {
    buildUponDefaultConfig = true
    allRules = false
    config = files("$rootDir/config/detekt/detekt.yml")
    // 基线吸收存量告警，新代码零容忍；基线文件入库，随修复逐步清空
    baseline = file("$rootDir/config/detekt/baseline.xml")
    reports {
        html { required.set(true) }
        xml { required.set(false) }
        txt { required.set(false) }
        sarif { required.set(false) }
    }
}

ktlint {
    android.set(true)
    verbose.set(true)
    outputToConsole.set(true)
}
