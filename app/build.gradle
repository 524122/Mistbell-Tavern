plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "com.google.devtools.ksp"
    id "io.gitlab.arturbosch.detekt"
    id "org.jlleitschuh.gradle.ktlint"
    id "com.github.jk1.dependency-license-report"
}

// 依赖许可证报告（供根项目 licenseGuard 消费；输出目录对齐根 build/reports/licenses）
licenseReport {
    outputDir = "$rootDir/build/reports/licenses"
    renderers = [new com.github.jk1.license.render.JsonReportRenderer("index.json", false)]
}

// jk1 插件任务持有 Project 引用，与配置缓存不兼容
tasks.named('generateLicenseReport') {
    notCompatibleWithConfigurationCache('jk1 dependency-license-report 尚未适配配置缓存')
}

android {
    namespace "com.mistbell.tavern.android"
    compileSdk 37

    defaultConfig {
        applicationId "com.mistbell.tavern.android"
        minSdk 26
        targetSdk 37
        versionCode 19
        versionName "0.9.8-beta"
        // androidTest 运行器：connected / 托管设备任务默认调用它（此前未显式声明，靠 am instrument 手动指定）
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DLITEHTML_BUILD_TESTING=OFF"
            }
        }
    }

    ndkVersion "28.2.13676358"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // v0.9：onnxruntime 原生库按 ABI 分包（arm64 ≈16MB / x86 等），避免单 universal APK 被
    // 无关架构拖大；universal 保留，侧载用户仍可按原方式安装
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug 构建也启用资源压缩（但不混淆代码）
            shrinkResources false
            minifyEnabled false
            // 隔离验收构建：显式传 -PisolatedMemoryValidation 才改测试包名，不影响常规 debug/release。
            if (project.hasProperty('isolatedMemoryValidation')) {
                applicationIdSuffix '.memoryvalidation'
            }
            if (project.hasProperty('isolatedApplicationIdSuffix')) {
                applicationIdSuffix = project.property('isolatedApplicationIdSuffix')
            }
            // 产出未签名 APK 的开关：gradlew :app:assembleDebug -PbuildUnsigned
            // （未签名包不能直接安装，需自行 apksigner 签名；用于自定义签名/分发场景）
            if (project.hasProperty('buildUnsigned')) {
                signingConfig = null
            }
        }
    }

    // 优化 APK 体积
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
            excludes += ['/META-INF/INDEX.LIST']
            excludes += ['/META-INF/DEPENDENCIES']
        }
        jniLibs {
            // sqlite3_load_extension 需要文件系统路径：.so 必须从 APK 解压到设备
            //（AGP 不允许在 manifest 里直接设 extractNativeLibs，等效开关在这里）
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Room schema 导出目录（exportSchema=true 时 KSP 输出到这里，迁移测试消费）
    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // JVM 单元测试没有 Android 运行时：未 stub 的框架方法（android.util.Log 等）返回默认值，
    // 而不是抛 "not mocked"。注入式服务（VectorMemoryService 等）因此可以做纯 JVM 回归测试。
    testOptions {
        unitTests {
            returnDefaultValues = true
            // 依赖棘轮基线更新开关（P1，见 ArchitectureRulesTest）：命令行加
            // -ParchBaselineUpdate=true 时，ArchitectureRulesTest 进入"重写基线后通过"模式；
            // 默认 "false" 为校验模式。用 providers 读 Gradle 属性以兼容配置缓存。
            all {
                systemProperty "arch.baseline.update",
                    providers.gradleProperty("archBaselineUpdate").getOrElse("false")
            }
        }

        // CI 托管设备（.github/workflows/ci.yml 的 androidTest job）：API 34 的 aosp x86_64 镜像是
        // 4K 页，避开 16K 页镜像对三方 .so 的兼容告警；minSdk 26，覆盖面足够
        managedDevices {
            localDevices {
                ciPixel6Api34 {
                    device = "Pixel 6"
                    apiLevel = 34
                    systemImageSource = "aosp"
                    testedAbi = "x86_64"
                }
            }
        }
    }
}

// skiko 的 Android 原生库不在 AAR 里（AAR 只有字节码），官方 sample（SKIKO-934）的做法：
// 单独解析 skiko-android-runtime-{x64,arm64} jar，解包出 libskiko-android-*.so 放进 jniLibs，
// 且必须在 merge*JniLibFolders 之前完成。运行时 System.loadLibrary("skiko-android-x64"/"-arm64")
// 按 os.arch 命中。skiko 无 armeabi-v7a/x86 产物，对应 split APK 不含 skiko native（冒烟只跑 x86_64/arm64）。
configurations {
    skikoNativeX64
    skikoNativeArm64
}

dependencies {
    // JS 脚本沙箱（规则包 script.js 的宿主）：纯 JVM、无网络/文件能力，指令数限流防失控
    implementation "org.mozilla:rhino:1.8.0"

    // ---- M1 spike：主题渲染引擎三依赖（仅冒烟测试消费，引擎实现待 M2） ----

    // jsoup：HTML/富文本解析（MIT）
    implementation "org.jsoup:jsoup:1.21.1"

    // skiko-android：Skia 的 Kotlin 绑定（软件光栅文本渲染）。坐标注意：
    // skiko-android 不在 Maven Central，只发布在 JetBrains Compose dev 仓库
    // （见 settings.gradle）。版本必须 >= 0.9.19：0.9.18 的运行时 .so 有大量
    // sksg（Skia 场景图）符号未定义（BIND_NOW 下 dlopen 直接失败），且 LOAD 段
    // 只按 4KB 对齐（16K 页模拟器/设备不兼容）；0.9.47 两项均已修复（0.9.47
    // 为 dev 仓库最高版，实测 sksg 零未定义 + 0x4000 对齐）。
    // androidx.compose 自身不依赖 skiko（走 android.graphics），无类冲突。
    // 排除 jbr-api：它是 JetBrains 桌面运行时（JBR）API，引用 java.awt 等 Android
    // 没有的类（skiko 的 Android 代码路径不使用它；留着会让 release R8 报 Missing class）。
    implementation("org.jetbrains.skiko:skiko-android:0.9.47") {
        exclude group: "org.jetbrains.runtime", module: "jbr-api"
    }

    // Yoga 3.2.1（MIT）：flexbox 布局引擎，JNI 实现。其 YogaNative 的 static 块走
    // SoLoader.loadLibrary("yoga")，而 soloader 在 pom 中是 optional（不传递），必须显式声明；
    // 使用前需 SoLoader.init(context)。
    implementation "com.facebook.yoga:yoga:3.2.1"
    implementation "com.facebook.soloader:soloader:0.10.5"

    // skiko Android 原生库（jar 内含 libskiko-android-*.so，由下方 Copy 任务解包进 jniLibs）
    skikoNativeX64 "org.jetbrains.skiko:skiko-android-runtime-x64:0.9.47"
    skikoNativeArm64 "org.jetbrains.skiko:skiko-android-runtime-arm64:0.9.47"

    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom

    // Compose UI
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Material 3
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3:material3-window-size-class"
    implementation "androidx.compose.material:material-icons-extended"

    // Activity & Lifecycle
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    // Navigation
    implementation "androidx.navigation:navigation-compose:2.8.5"

    // Networking
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // F1: SSE 真流式支持
    implementation "com.squareup.okhttp3:okhttp-sse:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

    // Image loading
    implementation "io.coil-kt:coil-compose:2.7.0"

    // ExifInterface for image rotation
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    // Core
    implementation "androidx.core:core-ktx:1.15.0"

    // Room
    // Room 2.8.x is compatible with the current Kotlin/KSP toolchain; 2.6.1
    // crashes in KSP while resolving Unit-returning @Query methods (JVM V signature).
    def roomVersion = '2.8.5'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // F3 本地语义向量：onnxruntime-android（MIT）+ assets 内置量化 BGE 中文模型
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.17.3"

    // 向量索引存储（sqlite-vec）：系统 SQLite 不支持加载扩展，用 requery 的自带 SQLite 打开
    // 独立向量库并加载 jniLibs 里的 vec0.so（android:extractNativeLibs="true" 提供文件系统路径）
    implementation "com.github.requery:sqlite-android:3.49.0"

    // 单元测试（本地 JVM）
    testImplementation "junit:junit:4.13.2"
    // 流链路复现/验证（ChatEventPushChainTest）：与主源集 coroutines 1.7.3 同版本
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"

    // Room 迁移测试（instrumented）
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:core:1.6.1"
}

// skiko native 解包：产物放 build 目录（不进源码树），注册为 main 的 jniLibs 源目录，
// 并挂到 merge*JniLibFolders 前保证打包时 .so 已就位（SKIKO-934 官方写法）。
def unpackSkikoX64 = tasks.register("unpackSkikoNativeX64", Copy) {
    from { configurations.skikoNativeX64.collect { zipTree(it) } }
    include "**/*.so"
    into layout.buildDirectory.dir("skiko-jni/x86_64")
}
def unpackSkikoArm64 = tasks.register("unpackSkikoNativeArm64", Copy) {
    from { configurations.skikoNativeArm64.collect { zipTree(it) } }
    include "**/*.so"
    into layout.buildDirectory.dir("skiko-jni/arm64-v8a")
}
// AGP 9 禁止向 SourceSet 传 Provider（无法区分生成/静态目录）；这里传静态 File，
// 任务依赖由下方 MergeSourceSetFolders 的 dependsOn 显式补上。
android.sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir("skiko-jni").get().asFile
tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach {
    if (name.endsWith("JniLibFolders")) {
        dependsOn unpackSkikoX64, unpackSkikoArm64
    }
}

// ---- F0 质量门配置（见 docs/FOUNDATION.md）----

detekt {
    buildUponDefaultConfig = true
    allRules = false
    config = files("$rootDir/config/detekt/detekt.yml")
    // 基线吸收存量告警，新代码零容忍；基线文件入库，随修复逐步清空
    baseline = file("$rootDir/config/detekt/baseline.xml")
    reports {
        html { required.set(true) }
        xml { required.set(false) }
        txt { required.set(false) }
        sarif { required.set(false) }
    }
}

ktlint {
    android.set(true)
    verbose.set(true)
    outputToConsole.set(true)
}
