name: Set up Android SDK components
description: >-
  定位或下载 Android command-line tools，接受 SDK 许可，再用 sdkmanager 安装指定组件。
  供 ci.yml 的 verify 与 instrumented 两个 job 共用。

inputs:
  packages:
    description: 要安装的 sdkmanager 包，每行一个（包名含分号，逐行传递以免被 shell 当作命令分隔符）
    required: true

# 诊断输出约定：Actions 的日志需要登录才能读，而注解（::notice:: / ::error::）在公开仓库的
# 运行页上匿名可见。所以这里的关键信息都写成注解，失败时把命令输出的末尾也带出来。
# 2026-11-26 实测的 runner 环境（CI #46 的诊断注解）：ANDROID_HOME=/usr/local/lib/android/sdk，
# curl / unzip / python3 / java 都在，但 sdkmanager 不在 PATH 上；仍不对环境做任何假设。
# 取退出码的写法：先执行命令，再单独 `code=$?`。写成 `if ! cmd; then code=$?` 取到的是取反后的 0。

runs:
  using: composite
  steps:
    - name: Locate or download Android command-line tools
      shell: bash
      run: |
        set -euo pipefail
        # 本步任何命令失败都在这里留下带命令与退出码的注解（匿名可见），然后按原退出码结束
        trap 'code=$?; echo "::error::设置 command-line tools 失败：命令 [$BASH_COMMAND] 退出码 $code"' ERR
        diag() { echo "::notice::android-sdk: $*"; }
        DEFAULT_SDK_ROOT="/usr/local/lib/android/sdk"
        if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}" ]; then
          SDK_ROOT="$ANDROID_HOME"
        elif [ -d "$DEFAULT_SDK_ROOT" ]; then
          SDK_ROOT="$DEFAULT_SDK_ROOT"
        else
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT"
        fi
        if [ ! -w "$SDK_ROOT" ]; then
          diag "SDK 根目录不可写（$SDK_ROOT），改用 $RUNNER_TEMP/android-sdk"
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT"
        fi
        diag "ANDROID_HOME=${ANDROID_HOME:-<unset>}；选用 SDK_ROOT=$SDK_ROOT；已有子目录：$(ls "$SDK_ROOT" 2>/dev/null | tr '\n' ' ')"
        diag "工具：curl=$(command -v curl || echo 无) unzip=$(command -v unzip || echo 无) python3=$(command -v python3 || echo 无) java=$(command -v java || echo 无)"
        diag "command-line tools：$(ls "$SDK_ROOT/cmdline-tools" 2>/dev/null | tr '\n' ' ' || echo 无)"

        CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools/latest"
        # 仅在 runner 没有预装 command-line tools 时才会下载。16111833 是 2026-11-26 查
        # https://dl.google.com/android/repository/repository2-3.xml 得到的稳定版 cmdline-tools;latest（23.0）
        CMDLINE_TOOLS_VERSION="16111833"
        if [ ! -x "$CMDLINE_TOOLS/bin/sdkmanager" ]; then
          URL="https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          ZIP="$RUNNER_TEMP/cmdline-tools.zip"
          UNZIPPED="$RUNNER_TEMP/cmdline-tools-unzip"
          rm -rf "$ZIP" "$UNZIPPED"
          curl -fsSL -o "$ZIP" "$URL"
          mkdir -p "$UNZIPPED" "$SDK_ROOT/cmdline-tools"
          # 不依赖 unzip：runner 上未必有。zipfile 解压不保留可执行位，所以下面补 chmod
          python3 -m zipfile -e "$ZIP" "$UNZIPPED"
          rm -rf "$CMDLINE_TOOLS"
          mv "$UNZIPPED/cmdline-tools" "$CMDLINE_TOOLS"
          chmod +x "$CMDLINE_TOOLS/bin/"*
          diag "已下载 command-line tools $CMDLINE_TOOLS_VERSION 到 $CMDLINE_TOOLS"
        fi
        if [ ! -x "$CMDLINE_TOOLS/bin/sdkmanager" ]; then
          echo "::error::sdkmanager 不存在：$CMDLINE_TOOLS/bin/sdkmanager"
          ls -la "$SDK_ROOT" "$SDK_ROOT/cmdline-tools" 2>&1 | tail -n 20
          exit 1
        fi
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "$CMDLINE_TOOLS/bin" >> "$GITHUB_PATH"
        "$CMDLINE_TOOLS/bin/sdkmanager" --version

    - name: Accept Android SDK licenses
      shell: bash
      # 固定写入若干个 y 而不是 `yes | ...`：后者在 pipefail 下会因 SIGPIPE（141）误判失败，
      # 而给管道加 `|| true` 又会把真正的错误（例如命令不存在）一并掩盖
      run: |
        # 显式关掉 errexit：GitHub 对 `shell: bash` 的步骤默认用 bash -eo pipefail 启动，
        # 这里的命令返回非零时要在后面自己取退出码、输出注解，不能让它直接终止脚本（CI #47 的教训）
        set +e
        set -uo pipefail
        log="$RUNNER_TEMP/sdk-licenses.log"
        printf 'y\ny\ny\ny\ny\ny\ny\ny\n' | sdkmanager --licenses > "$log" 2>&1
        code=$?
        if [ "$code" -ne 0 ]; then
          echo "::error::sdkmanager --licenses 失败（退出码 $code）"
          tr '\r' '\n' < "$log" | awk 'NF' | tail -n 15
          exit "$code"
        fi
        tr '\r' '\n' < "$log" | awk 'NF' | tail -n 2

    - name: Install requested packages
      shell: bash
      env:
        ANDROID_PACKAGES: ${{ inputs.packages }}
      run: |
        # 显式关掉 errexit（理由见「Accept Android SDK licenses」一步）：sdkmanager 的退出码要自己取
        set +e
        set -uo pipefail
        args=()
        while IFS= read -r pkg; do
          pkg="${pkg%$'\r'}"
          if [ -n "$pkg" ]; then args+=("$pkg"); fi
        done <<< "$ANDROID_PACKAGES"
        log="$RUNNER_TEMP/sdk-install.log"
        sdkmanager "${args[@]}" > "$log" 2>&1
        code=$?
        # sdkmanager 用 \r 原地刷新进度条：先把 \r 换成换行，之后的按行筛选才有意义
        tr '\r' '\n' < "$log" | awk 'NF' > "$log.lines"
        if [ "$code" -ne 0 ]; then
          echo "::warning title=sdkmanager::sdkmanager 请求的包：${args[*]}；退出码 ${code}。下面逐个核对是否真的装上"
        fi
        awk '/Warning|Error|error|Failed|failed|not found|inconsistent|Could not|denied|No such|licen[cs]e/ { print substr($0, 1, 300) }' "$log.lines" \
          | awk '!seen[$0]++' | head -n 5 \
          | while IFS= read -r line; do echo "::warning title=sdkmanager::$line"; done
        # 不单凭 sdkmanager 的退出码论成败，而是核对后置条件：请求的每一个包都在已安装清单里。
        # CI #46 里它退出码非零、包却都装上了（随后的 assembleDebug 通过）；当时的脚本把退出码
        # 误记成 0 才让流程继续。现在把异常如实报出来，只有确实缺包才让步骤失败。
        installed_ids="$(sdkmanager --list_installed 2>/dev/null | awk -F'|' 'NF >= 2 { id = $1; gsub(/^[ \t]+|[ \t]+$/, "", id); print id }' || true)"
        missing=()
        for pkg in "${args[@]}"; do
          if ! printf '%s\n' "$installed_ids" | awk -v want="$pkg" '$0 == want { found = 1 } END { exit found ? 0 : 1 }'; then
            missing+=("$pkg")
          fi
        done
        if [ "${#missing[@]}" -ne 0 ]; then
          echo "::error::sdkmanager 安装后仍缺这些包：${missing[*]}（sdkmanager 退出码 ${code}）"
          echo "----- sdkmanager 输出末尾 -----"
          tail -n 25 "$log.lines"
          echo "----- 已安装清单 -----"
          sdkmanager --list_installed 2>&1 | tail -n 30
          exit 1
        fi
        echo "全部请求的包均已安装：${args[*]}"
        tail -n 3 "$log.lines"

    - name: List installed packages
      shell: bash
      # 仅用于留档：sdkmanager 的退出码只变成一条警告，不让这一步失败
      run: |
        set +e
        output="$(sdkmanager --list_installed 2>&1)"
        code=$?
        printf '%s\n' "$output" | tail -n 40
        if [ "$code" -ne 0 ]; then
          echo "::warning title=sdkmanager::--list_installed 退出码 $code（仅留档，不影响后续步骤）"
        fi
        exit 0
