name: CI

on:
  push:
    branches: [ feature, main, master ]
  pull_request:

jobs:
  verify:
    name: Build & Verify (F0 质量门)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK（固定版本，避免 runner 镜像漂移）
        uses: android-actions/setup-android@v3

      - name: Set up Gradle（缓存与校验）
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew executable（防御 Windows 提交丢失可执行位）
        run: chmod +x gradlew

      - name: Build & Verify
        # 与本地 `gradlew checkAll` 等价：构建 + 单测 + detekt + ktlint + 许可证红线
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:detekt :app:ktlintCheck licenseGuard --continue

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
