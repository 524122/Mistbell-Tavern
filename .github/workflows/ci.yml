name: CI

on:
  push:
    branches: [ feature, main, master ]
  pull_request:

# Android SDK 组件经仓库内的复合 action ./.github/actions/android-sdk 安装：定位或下载
# command-line tools → 接受许可 → sdkmanager 安装。两个 job 共用同一份，避免漂移。
# 版本与 app/build.gradle 对齐：compileSdk 37、ndkVersion 28.2.13676358、CMake 3.22.1；
# build-tools 由 AGP 按自身默认版本自动补装（许可已接受）。
# 背景：2026-10-01 至 2026-11-26 的 19 次运行全部失败在环境搭建阶段（Gradle 从未开始）——
# 先是 android-actions/setup-android@v3，改用 runner 自带 sdkmanager 后是命令不在 PATH（退出码 127）。

jobs:
  verify:
    name: Build & Verify (F0 质量门)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 37, NDK 28.2.13676358, CMake 3.22.1)
        uses: ./.github/actions/android-sdk
        with:
          packages: |
            platform-tools
            platforms;android-37
            ndk;28.2.13676358
            cmake;3.22.1

      - name: Set up Gradle（缓存与校验）
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew executable（防御 Windows 提交丢失可执行位）
        run: chmod +x gradlew

      # 与本地 `gradlew checkAll` 等价的五个检查，拆成独立步骤：日志需要登录才能看，
      # 步骤级结论与失败注解（含退出码）匿名可读，哪一步失败从运行页就能定位
      - name: assembleDebug
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: detekt and ktlint
        run: ./gradlew :app:detekt :app:ktlintCheck --console=plain

      - name: licenseGuard
        run: ./gradlew licenseGuard --console=plain

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore

  instrumented:
    name: androidTest (Gradle Managed Device)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # 观察期（docs/ROADMAP.md 重新设计规划 P0 第 2 项）：本 job 只报告、不拦截推送与合并。
    # 连续 7 次绿之后去掉这一行，改为必须通过。不做自动重试——重试会把不稳定藏起来。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 37, NDK, CMake, managed device image)
        uses: ./.github/actions/android-sdk
        with:
          # 最后一项与 app/build.gradle 的 testOptions.managedDevices.ciPixel6Api34 对应
          packages: |
            platform-tools
            platforms;android-37
            ndk;28.2.13676358
            cmake;3.22.1
            system-images;android-34;aosp;x86_64

      - name: Enable KVM
        # 托管设备依赖 /dev/kvm；runner 镜像默认只允许 kvm 组访问
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Gradle（缓存与校验）
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew executable
        run: chmod +x gradlew

      - name: Run androidTest on the managed device
        # instrumented 测试：Room 迁移数据完整性、向量/记忆契约、渲染冒烟
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:ciPixel6Api34DebugAndroidTest --console=plain

      - name: Upload androidTest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidtest-reports
          path: |
            app/build/outputs/androidTest/**
            app/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 7
